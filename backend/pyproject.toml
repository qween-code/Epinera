[project]
name = "sentinel-backend"
version = "0.1.0"
description = "SAP & ProManage Sentinel — backend API and analysis engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "rq>=1.16",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27",
    "anthropic>=0.39",
    "aiosmtplib>=3.0",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "websockets>=13.1",
    "watchfiles>=0.24",
    "numpy>=1.26",
    "Pillow>=10.4",
    "paddleocr>=2.8",
    "paddlepaddle>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
